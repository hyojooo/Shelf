# 应用基础信息
appId: com.shelf.app
productName: Shelf
copyright: Copyright © 2026 Shelf

directories:
  output: dist
  buildResources: assets

files:
  - out/**/*
  - package.json

# macOS 打包配置（最低 10.15 Catalina）
mac:
  category: public.app-category.utilities
  minimumSystemVersion: '10.15'
  identity: null  # 显式禁用代码签名（国内 Apple 时间戳服务器不可达，空字符串""会被当成自动检测而非禁用）
  forceCodeSigning: false
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  icon: assets/icon.icns   # 由 scripts/gen_icon.py 生成（含多尺寸）

# Windows 打包配置（最低 Windows 10）
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: assets/icon.png   # 由 scripts/gen_icon.py 生成（1024²）

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true

# 自动更新（GitHub Releases 作为更新源，可改为私有服务器）
publish:
  - provider: github
    owner: hyojooo
    repo: Shelf

# asar 加密主进程代码
asar: true
